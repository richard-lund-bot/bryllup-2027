    <script>
      // iOS Safari tillater pinch-zoom uansett viewport-innstillinger –
      // blokker selve gestene direkte (må ha passive: false for å virke)
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener(
        "touchmove",
        function (e) {
          if (typeof e.scale === "number" && e.scale !== 1) e.preventDefault();
        },
        { passive: false }
      );
      // Vaktpost: skulle siden likevel drive sideveis, nullstilles den straks
      window.addEventListener(
        "scroll",
        function () {
          if (window.scrollX !== 0) window.scrollTo(0, window.scrollY);
        },
        { passive: true }
      );
    </script>
    <script>
      // GitHub Pages SPA-triks: dekoder redirect fra 404.html
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
