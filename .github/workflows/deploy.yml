name: Bygg nettsiden til docs

# Nettsiden serveres fra docs/ på main (GitHub Pages: main:/docs).
# docs/ bygges og committes normalt sammen med kodeendringene
# (npm run build). Denne workflowen er kun en manuell reserveløsning
# hvis docs/ skulle komme ut av sync med kildekoden.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit docs/ hvis bygget endret seg
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Bygg nettsiden (automatisk)"
            git push
          else
            echo "Ingen endringer i bygget."
          fi
      - name: Be Pages publisere på nytt
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
